<!doctype html>
<meta charset="utf-8" />

<head>
    <title>Update Fluxer Login</title>

    <link rel="stylesheet" href="./common.css" type="text/css" />
    <link rel="stylesheet" href="./fluxer-login.css" type="text/css" />
</head>

<body>
    <h1>Sign in again</h1>
    <p>Your Fluxer session is no longer valid. Choose an instance and sign in with handoff or a token.</p>

    <form>
        <label>
            <div>
                <h2>Fluxer Instance</h2>
                <span>Stable, Canary, or a self-hosted domain</span>
            </div>
            <select name="fluxerInstance" id="fluxer-instance">
                <option value="canary">Fluxer Canary</option>
                <option value="stable">Fluxer Stable</option>
                <option value="custom">Custom</option>
            </select>
        </label>

        <div class="row" id="custom-instance" hidden>
            <div>
                <h2>Instance Domain</h2>
                <span>Your self-hosted Fluxer origin</span>
            </div>
            <div class="stack">
                <div class="domain-row">
                    <input type="text" name="fluxerCustomDomain" id="custom-domain" placeholder="chat.example.com" />
                    <button type="button" id="connect-btn">Connect</button>
                </div>
                <span class="status" id="connect-status"></span>
            </div>
        </div>

        <label>
            <div>
                <h2>Sign In</h2>
                <span>Desktop handoff is recommended</span>
            </div>
            <select name="authMethod" id="auth-method">
                <option value="handoff" selected>Desktop handoff</option>
                <option value="token">Token login</option>
            </select>
        </label>

        <div class="auth-rows">
            <div class="row" id="handoff-login" hidden>
                <div>
                    <h2>Desktop Handoff</h2>
                    <span>Enter this code on the Fluxer login handoff screen</span>
                </div>
                <div class="stack">
                    <div id="handoff-code">--------</div>
                    <div class="controls">
                        <button type="button" id="handoff-start">Get code</button>
                        <button type="button" id="handoff-open">Open code screen</button>
                    </div>
                    <span class="status" id="handoff-status"></span>
                </div>
            </div>

            <div class="row" id="token-login" hidden>
                <div>
                    <h2>Fluxer Token</h2>
                    <span>Take a look at the README for instructions</span>
                </div>
                <div class="stack">
                    <input type="password" name="fluxerToken" id="fluxer-token" />
                    <label id="show-wrap">
                        <input type="checkbox" id="show-token" />
                        Show Token
                    </label>
                </div>
            </div>
        </div>
    </form>

    <p class="status" id="form-status"></p>

    <div id="buttons">
        <button id="cancel" type="button">Cancel</button>
        <button id="submit" type="button">Continue</button>
    </div>
</body>

<script src="./fluxer-login.js"></script>
